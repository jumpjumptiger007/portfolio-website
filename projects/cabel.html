<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interdimensional Cable - 跨维度电视</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #room-bg {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            /* 使用 jsDelivr CDN 保证图片在任意环境均可稳定加载 */
            background: url('https://cdn.jsdelivr.net/gh/mrmcpowned/interdimensionalcable@master/img/bg.png') no-repeat center center;
            background-size: contain;
        }

        #tv-screen {
            position: absolute;
            width: 38%;
            height: 38.6%;
            top: 31.8%;
            left: 32.8%;
            background: #000;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        #player-container, #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        #tv-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(circle at 50% 50%, #fff, #000 2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s ease;
            z-index: 10;
        }

        #tv-static.active {
            opacity: 0.9;
        }

        #power-off-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 20;
        }

        #remote-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            user-select: none;
        }

        .remote-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .remote-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #555;
        }

        .btn-power {
            background: #c62828;
            border-color: #e53935;
        }

        .btn-power:hover {
            background: #b71c1c;
        }

        #channel-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 14px;
            font-family: monospace;
            text-shadow: 0 0 5px #00ff00;
            z-index: 15;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="room-bg">
        <div id="tv-screen">
            <div id="channel-info">CH --</div>
            <div id="tv-static"></div>
            <div id="power-off-overlay"></div>
            <div id="player-container">
                <div id="player"></div>
            </div>
        </div>
    </div>
</div>

<div id="remote-overlay">
    <div class="remote-title">Interdimensional Remote</div>
    <div class="remote-controls">
        <button class="btn btn-power" id="btn-power">PWR</button>
        <button class="btn" id="btn-next">NEXT CH ▶</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const REDDIT_API_URL = 'https://www.reddit.com/r/InterdimensionalCable/hot.json?limit=100';
    let videoQueue = [];
    let player = null;
    let isPowerOn = true;
    let audioCtx = null;

    function playStaticSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.1;

            noise.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        } catch(e) {}
    }

    async function fetchRedditVideos() {
        try {
            const response = await fetch(REDDIT_API_URL);
            const data = await response.json();
            const posts = data.data.children;

            videoQueue = [];
            posts.forEach(post => {
                const url = post.data.url;
                const ytId = extractYouTubeId(url);
                if (ytId) {
                    videoQueue.push({ id: ytId, title: post.data.title });
                }
            });

            videoQueue.sort(() => Math.random() - 0.5);
            // 核心调试信息：确认数据已成功抓取
            console.log("Successfully fetched videos from Reddit. List:", videoQueue);

            if (videoQueue.length > 0 && player && player.loadVideoById) {
                playNextChannel();
            }
        } catch (err) {
            console.error("Fetch Error:", err);
        }
    }

    function extractYouTubeId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'showinfo': 0,
                'rel': 0,
                'iv_load_policy': 3,
                'modestbranding': 1,
                'origin': window.location.origin || '*'
            },
            events: {
                'onReady': fetchRedditVideos,
                'onStateChange': (e) => {
                    if (e.data === YT.PlayerState.ENDED && isPowerOn) playNextChannel();
                },
                'onError': () => playNextChannel()
            }
        });
    }

    function playNextChannel() {
        if (!isPowerOn || videoQueue.length === 0) return;

        const staticEl = document.getElementById('tv-static');
        const channelInfo = document.getElementById('channel-info');

        staticEl.classList.add('active');
        playStaticSound();

        const currentVideo = videoQueue[Math.floor(Math.random() * videoQueue.length)];
        channelInfo.innerText = `CH ${Math.floor(Math.random() * 899) + 100}`;
        // 核心调试信息：确认正在更换频道和ID
        console.log("Channel changed. Now playing: " + currentVideo.id);

        setTimeout(() => {
            player.loadVideoById(currentVideo.id);
            setTimeout(() => {
                staticEl.classList.remove('active');
            }, 300);
        }, 200);
    }

    document.getElementById('btn-next').addEventListener('click', playNextChannel);
    document.getElementById('btn-power').addEventListener('click', () => {
        const overlay = document.getElementById('power-off-overlay');
        isPowerOn = !isPowerOn;
        if (!isPowerOn) {
            overlay.style.display = 'block';
            if (player && player.stopVideo) player.stopVideo();
        } else {
            overlay.style.display = 'none';
            playNextChannel();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowRight') playNextChannel();
    });
</script>

</body>
</html>
